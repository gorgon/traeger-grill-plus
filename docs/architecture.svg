<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="430" fill="#f7f3ec"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#2b2118">Traeger Grill Control — how it fits together</text>

  <!-- Phone -->
  <rect x="30" y="80" width="230" height="130" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="2"/>
  <text x="145" y="112" font-size="16" font-weight="700" fill="#2b2118" text-anchor="middle">📱 Phone app</text>
  <text x="145" y="140" font-size="13" fill="#6b5d4f" text-anchor="middle">Cook screen · stages · alarms</text>
  <text x="145" y="162" font-size="13" fill="#6b5d4f" text-anchor="middle">Auto-refresh ≈ every 60s</text>
  <text x="145" y="184" font-size="13" fill="#6b5d4f" text-anchor="middle">Keeps screen awake · speaks</text>

  <!-- Server -->
  <rect x="345" y="80" width="250" height="130" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="2"/>
  <text x="470" y="112" font-size="16" font-weight="700" fill="#2b2118" text-anchor="middle">🖥️ App server</text>
  <text x="470" y="140" font-size="13" fill="#6b5d4f" text-anchor="middle">Stage engine · corrections</text>
  <text x="470" y="162" font-size="13" fill="#6b5d4f" text-anchor="middle">Live refresh · trend logic</text>
  <text x="470" y="184" font-size="13" fill="#6b5d4f" text-anchor="middle">Stores ONE login, server-side only</text>

  <!-- Cloud -->
  <rect x="680" y="80" width="210" height="130" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="2"/>
  <text x="785" y="112" font-size="16" font-weight="700" fill="#2b2118" text-anchor="middle">☁️ Traeger cloud</text>
  <text x="785" y="140" font-size="13" fill="#6b5d4f" text-anchor="middle">WiFIRE API + MQTT</text>
  <text x="785" y="162" font-size="13" fill="#6b5d4f" text-anchor="middle">auth-api · mobile-iot-api</text>
  <text x="785" y="184" font-size="13" fill="#6b5d4f" text-anchor="middle">Signed WebSocket feed</text>

  <!-- Grill -->
  <rect x="680" y="270" width="210" height="110" rx="14" fill="#fff4e8" stroke="#e0a458" stroke-width="2"/>
  <text x="785" y="302" font-size="16" font-weight="700" fill="#2b2118" text-anchor="middle">🔥 The grill</text>
  <text x="785" y="330" font-size="13" fill="#6b5d4f" text-anchor="middle">Pro 575 · WiFIRE</text>
  <text x="785" y="352" font-size="13" fill="#6b5d4f" text-anchor="middle">Ignition is always manual</text>

  <!-- DB -->
  <rect x="345" y="270" width="250" height="110" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="2"/>
  <text x="470" y="302" font-size="16" font-weight="700" fill="#2b2118" text-anchor="middle">🗄️ Local database</text>
  <text x="470" y="330" font-size="13" fill="#6b5d4f" text-anchor="middle">Sessions · snapshots · test runs</text>
  <text x="470" y="352" font-size="13" fill="#6b5d4f" text-anchor="middle">Never uploaded anywhere</text>

  <!-- arrows -->
  <line x1="260" y1="145" x2="337" y2="145" stroke="#b4552d" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="337" y1="168" x2="260" y2="168" stroke="#8a9a5b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="298" y="132" font-size="12" fill="#b4552d" text-anchor="middle">actions</text>
  <text x="298" y="192" font-size="12" fill="#8a9a5b" text-anchor="middle">fresh state</text>

  <line x1="595" y1="130" x2="672" y2="130" stroke="#b4552d" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="672" y1="168" x2="595" y2="168" stroke="#8a9a5b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="633" y="116" font-size="12" fill="#b4552d" text-anchor="middle">commands</text>
  <text x="633" y="192" font-size="12" fill="#8a9a5b" text-anchor="middle">live feed</text>

  <line x1="785" y1="210" x2="785" y2="262" stroke="#8a9a5b" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="595" y1="325" x2="672" y2="325" stroke="#d8cfc0" stroke-width="3" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <text x="30" y="412" font-size="13" fill="#6b5d4f">The browser never talks to Traeger directly — Traeger's CORS policy forbids it. Every refresh runs server-side over a live MQTT listen.</text>
</svg>
